[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "1.0.0"
description = "Football match prediction: Dixon-Coles, Elo, engineered-feature ML and a learned ensemble, with backtesting and season simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
football-predictor = "football_predictor.cli:main"

[tool.setuptools]
packages = ["football_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
